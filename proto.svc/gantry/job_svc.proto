// Hand-written overlay merged onto the generated JobService by
// scripts/gen-proto.sh (protobuf-merge). Adds the RPCs protoc-gen-orm-service
// does not generate.
edition = "2023";

package gantry;

import "gantry/job.proto";
import "gantry/store_svc.g.proto";
import "google/protobuf/timestamp.proto";

// Add/Get/Erase (merged in from the orm crud option) plus the actions below are
// the client surface. The crud-generated Patch is intentionally NOT a client
// operation — a submitted job is fixed, labels included. It is retained in the
// generated API only as a test affordance, so a harness can seed or rewrite a
// job's initial state; production keeps it off the client surface.
service JobService {
  // List returns jobs newest-first from the same live registry as Get, so it too
  // holds only jobs since process start; use EventService for job history.
  rpc List(JobListRequest) returns (JobListResponse);
  // Watch streams snapshots of the job as its transfers progress and ends
  // after the snapshot that carries a terminal state. The gRPC counterpart
  // of the REST SSE endpoint GET /v1/job/{id}/progress.
  rpc Watch(JobRef) returns (stream Job);
  // Plan runs admission for a would-be job without submitting it: store
  // binding, verification, and coalescing are all evaluated.
  rpc Plan(JobPlanRequest) returns (JobPlanResponse);
  // Cancel stops a running job but keeps its record for inspection; the
  // returned snapshot is taken right after the cancel is signaled.
  rpc Cancel(JobRef) returns (Job);
  // Retry re-submits a terminal job's original request as a new job, with
  // fresh resolution and verification.
  rpc Retry(JobRef) returns (Job);
}

message JobListRequest {
  // Keep only jobs in this state.
  JobState state = 1;
  // Substring match on the requested ref.
  string ref = 2;
  // Jobs created at or after this instant.
  google.protobuf.Timestamp since = 3;
  // Label selector: a job matches when it carries every key with the given
  // value (subset match). An empty map matches everything.
  map<string, string> labels = 4;

  // Maximum items to return; 0 = no limit.
  int32 page_size = 10;
  // Continuation token from the previous response; empty starts from the
  // beginning.
  string page_token = 11;
}

message JobListResponse {
  // One page of results, newest-first.
  repeated Job items = 1;
  // Empty when there are no further results.
  string next_page_token = 2;
}

// The same inputs as JobAddRequest, evaluated without submitting.
message JobPlanRequest {
  // Image reference to move.
  string ref = 1;
  // Source registry; defaults to the ref's registry.
  StoreRef source = 2;
  // Target store: a registry or an engine.
  StoreRef target = 3;
  // Registry target: platforms to copy (empty = all). Engine target: the
  // single platform to pull (empty = daemon's).
  repeated string platforms = 4;
  // Copy source referrer artifacts along with the image; absent = server
  // default.
  bool copy_referrers = 5;
  // Engine target only: names the image would be recorded under.
  repeated string as = 6;
  // Engine target only: pull from the registry named in `ref` when `source`
  // cannot serve the image; absent = server default.
  bool fallback_to_origin = 7;
  // Refuse the job when `source` could not confirm what `ref` means, rather
  // than reading a nearer cache of it on faith; absent = server default.
  bool require_authority = 8;
}

message JobPlanResponse {
  // Resolved source store name.
  string source = 1;
  // Resolved target store name.
  string target = 2;
  // Source-side ref, digest-pinned when verified.
  string source_ref = 3;
  // Target-side ref: the rewritten cache ref, or the ref the engine
  // is told to pull.
  string target_ref = 4;
  // Registry target: empty = all platforms; engine target: the
  // single platform pulled.
  repeated string platforms = 5;
  // Effective value after the server default is applied.
  bool copy_referrers = 6;
  // Admission verification outcome, when verification ran.
  Verification verification = 7;
  // The active job an identical submit would coalesce onto, if any.
  string coalesces = 8;
  // Engine target: the (normalized) names the image is recorded under.
  repeated string as = 9;
  // Effective value after the server default is applied.
  bool fallback_to_origin = 10;
  // Engine target: the ref the engine would be told to pull if `source` could
  // not serve the image. Empty when the job has no fallback — the flag is off,
  // `source` already is the origin, or the origin is not addressable from this
  // engine.
  string fallback_ref = 11;
  // The route the job would run: one entry per hop, in order, each listing the
  // sources that hop would try. A single hop with one source is the ordinary
  // move. Advisory — coalescing is request-level, so a submit can be served by
  // an active job that resolved a different route.
  repeated PlanStep steps = 12;
}

// PlanStep is one hop of a planned route. Stores are named rather than embedded:
// this is preflight output, and StoreService.Get answers everything else about
// them.
message PlanStep {
  // The store this hop fills.
  string store = 1;
  // The reference this hop lands in that store; empty for an engine hop, whose
  // per-source pull reference is the only reference there is.
  string ref = 2;
  // Where this hop would read from, in the order it would try them.
  repeated PlanSource sources = 3;
  // Set on a hop gantry added for its own benefit, whose failure the job
  // tolerates.
  bool optional = 4;
}

// PlanSource is one place a hop would read from.
message PlanSource {
  string store = 1;
  string ref = 2;
  // Why this source is in the list.
  PlanSourceWhy why = 3;
}

enum PlanSourceWhy {
  PLAN_SOURCE_WHY_UNSPECIFIED = 0;
  // The source the caller named.
  PLAN_SOURCE_WHY_PLANNED = 1;
  // A nearer copy gantry chose to read through.
  PLAN_SOURCE_WHY_ROUTE = 2;
  // The registry named in the job's own ref.
  PLAN_SOURCE_WHY_ORIGIN = 3;
}
