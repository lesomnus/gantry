components:
  schemas:
    server.createJobRequest:
      properties:
        distribute:
          items:
            type: string
          type: array
          uniqueItems: false
        from:
          type: string
        platforms:
          items:
            type: string
          type: array
          uniqueItems: false
        ref:
          type: string
        to:
          type: string
      type: object
    server.errorResponse:
      properties:
        error:
          type: string
      type: object
    server.jobListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/warm.JobSnapshot'
          type: array
          uniqueItems: false
      type: object
    server.storeListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/store.Status'
          type: array
          uniqueItems: false
      type: object
    server.storePullRequest:
      properties:
        ref:
          type: string
      type: object
    server.storePullResponse:
      properties:
        kind:
          type: string
        ref:
          type: string
        state:
          type: string
        store:
          type: string
      type: object
    store.Caps:
      properties:
        gc:
          type: boolean
        pull:
          type: boolean
        read:
          type: boolean
        verify:
          type: boolean
        write:
          type: boolean
      type: object
    store.Status:
      properties:
        address:
          type: string
        capabilities:
          $ref: '#/components/schemas/store.Caps'
        error:
          type: string
        host:
          type: string
        kind:
          type: string
        mode:
          type: string
        name:
          type: string
        namespace:
          type: string
        ready:
          type: boolean
      type: object
    warm.JobSnapshot:
      properties:
        created_at:
          type: string
        ended_at:
          type: string
        error:
          type: string
        id:
          type: string
        platforms:
          items:
            type: string
          type: array
          uniqueItems: false
        ref:
          type: string
        started_at:
          type: string
        state:
          $ref: '#/components/schemas/warm.JobState'
        transfers:
          items:
            $ref: '#/components/schemas/warm.TransferSnapshot'
          type: array
          uniqueItems: false
      type: object
    warm.JobState:
      enum:
      - pending
      - running
      - done
      - failed
      - canceled
      type: string
      x-enum-varnames:
      - JobPending
      - JobRunning
      - JobDone
      - JobFailed
      - JobCanceled
    warm.LayerSnapshot:
      properties:
        digest:
          type: string
        done:
          type: integer
        platform:
          type: string
        state:
          type: string
        total:
          type: integer
      type: object
    warm.TransferSnapshot:
      properties:
        bytes_done:
          type: integer
        bytes_total:
          type: integer
        error:
          type: string
        from:
          type: string
        kind:
          type: string
        layers:
          items:
            $ref: '#/components/schemas/warm.LayerSnapshot'
          type: array
          uniqueItems: false
        ref:
          type: string
        state:
          type: string
        store:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Move container images between stores (OCI registries and docker/containerd engines) and track per-layer progress.
    A job copies an image `from` an OCI store `to` another, then `distribute` engines pull it.
  title: gantry API
  version: "1.0"
openapi: 3.1.0
paths:
  /healthz:
    get:
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ok
      summary: Liveness probe
      tags:
      - meta
  /v1/job:
    get:
      parameters:
      - description: filter by state
        in: query
        name: state
        schema:
          type: string
      - description: filter by ref substring
        in: query
        name: ref
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.jobListResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: List jobs
      tags:
      - jobs
    post:
      description: 'Move an image: copy `from` (oci) into `to` (oci), then have the
        `distribute` engines pull it. Idempotent per identical move.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/server.createJobRequest'
                description: job request
                summary: request
        description: job request
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/warm.JobSnapshot'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Bad Request
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Create a job
      tags:
      - jobs
  /v1/job/{id}:
    delete:
      parameters:
      - description: job id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Cancel or evict a job
      tags:
      - jobs
    get:
      parameters:
      - description: job id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/warm.JobSnapshot'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get a job
      tags:
      - jobs
  /v1/job/{id}/progress:
    get:
      description: Server-Sent Events stream of progress; with ?wait=<dur> it long-polls
        and returns one JSON snapshot once the job is terminal.
      parameters:
      - description: job id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: long-poll duration, e.g. 30s
        in: query
        name: wait
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/warm.JobSnapshot'
          description: OK
        "404":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Stream job progress
      tags:
      - jobs
  /v1/store:
    get:
      description: Configured stores with their kind, capabilities, and readiness.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.storeListResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: List stores
      tags:
      - stores
  /v1/store/{name}/pull:
    post:
      description: Tells one engine store to pull a reference, decoupled from the
        job pipeline (manual reconcile).
      parameters:
      - description: engine store name
        in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/server.storePullRequest'
                description: reference to pull
                summary: request
        description: reference to pull
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.storePullResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server.errorResponse'
          description: Bad Gateway
      security:
      - BearerAuth: []
      summary: Trigger an engine store to pull
      tags:
      - stores
