services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity

    user: "1000"
    privileged: true
    environment:
      SHELL: /bin/zsh
      DOCKER_HOST: tcp://docker:2375
      # A dedicated containerd sidecar (below), independent of docker. Its own
      # namespace, no shared-socket chmod hack, and pull-only integration tests
      # run against a clean containerd rather than docker's bundled one.
      CONTAINERD_ADDRESS: /run/containerd/containerd.sock
      CONTAINERD_NAMESPACE: gantry

    volumes:
      - command.history:/commandhistory
      - go.cache.mod:/home/hypnos/go/pkg/mod
      - go.cache.bin:/home/hypnos/.cache/go-build

      - ..:/workspace
      - ${HOME}/workspaces:/workspaces

      # Dedicated containerd's socket, shared from the `containerd` service.
      - containerd.run:/run/containerd

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
          pids: 2048
        reservations:
          cpus: "2"
          memory: 4G

  docker:
    image: docker:dind
    # Run dockerd as PID 1; a background loop keeps the bundled containerd
    # socket reachable by the dev user (uid 1000) since it cannot chmod it itself.
    command:
      - sh
      - -c
      - |
        ( while :; do
            chmod 0711 /run/docker/containerd 2>/dev/null
            chmod 0666 /run/docker/containerd/containerd.sock 2>/dev/null
            sleep 3
          done ) &
        exec dockerd --host=tcp://0.0.0.0:2375

    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""

    volumes:
      - docker.data:/var/lib/docker

    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
        reservations:
          cpus: "4"
          memory: 4G

  # Dedicated containerd, independent of docker. The docker:dind image already
  # ships a standalone containerd binary (+ runc/shim), so no custom image is
  # needed — run containerd instead of dockerd. The pull/unpack the retention
  # and anchored-pull tests exercise need only the daemon + overlayfs snapshotter
  # (no CNI, no runc tasks). A background loop opens the socket for the dev user
  # (uid 1000), which cannot chmod it itself, mirroring the docker service.
  containerd:
    image: docker:dind
    command:
      - sh
      - -c
      - |
        ( while :; do
            chmod 0711 /run/containerd 2>/dev/null
            chmod 0666 /run/containerd/containerd.sock 2>/dev/null
            sleep 3
          done ) &
        exec containerd

    privileged: true

    volumes:
      - containerd.data:/var/lib/containerd
      - containerd.run:/run/containerd

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G

volumes:
  command.history:
  go.cache.mod:
  go.cache.bin:
  docker.data:
  containerd.data:
  containerd.run:
