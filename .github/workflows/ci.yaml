name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/ci.yaml
      - cmd/**
      - internal/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - main.go
      - pb/**
      - proto/**
      - proto.svc/**
      - buf.yaml
      - buf.gen.yaml
      - buf.gen.svc.yaml
      - scripts/gen-proto.sh
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Runs unit tests plus the hermetic L1 E2E suite (internal/e2e, no build
      # tag). The docker daemon on the runner drives the docker integration
      # tests; containerd-only tests self-skip when no containerd socket is
      # present. No external infra.
      - name: Test (race)
        run: go test -race ./...

  # L2 real-daemon E2E: the runner's host docker daemon (shared netns → the
  # published loopback registry needs no daemon.json) across registry
  # implementations. Payload images are synthesized in-process (no Docker Hub
  # egress); only the registry daemon image is pulled.
  e2e-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        registry:
          - "registry:2" # OCI referrers tag-fallback path
          - "registry:3" # native referrers API (Distribution v3)
          - "ghcr.io/lesomnus/cr:edge" # lesomnus/cr, configured by the harness
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pre-pull the registry image
        run: docker pull ${{ matrix.registry }}
      - name: E2E (real daemon, ${{ matrix.registry }})
        env:
          GANTRY_E2E_REGISTRY: ${{ matrix.registry }}
        run: go test -tags e2e -race -run TestL2 ./internal/e2e/...

  # Digest `as` names on a DOCKER engine -- the names a robot's jobspec uses --
  # need the daemon to be on the containerd image store. The runner's daemon is
  # not: it comes as Docker 28 on the classic store (overlay2), which refuses
  # such a name before pulling. So every test of them against a real docker
  # daemon self-skipped in e2e-docker above, green, and the first place the
  # path ran against a daemon was a robot. #39 was found there: a delivery that
  # reported DONE and left nothing on the node.
  #
  # This job flips the runner's own daemon to the containerd image store --
  # what docker-ce installed fresh gives a robot -- and runs the tests that
  # need it. It checks that the switch took and that the test PASSED, by name:
  # a test that skips is a test that is green.
  e2e-docker-containerd-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Switch the daemon to the containerd image store
        run: |
          set -eu
          # Keep what the runner image configured; add the one feature.
          if [ -s /etc/docker/daemon.json ]; then
            sudo jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json > daemon.json
          else
            echo '{"features":{"containerd-snapshotter":true}}' > daemon.json
          fi
          sudo install -m 0644 daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.ServerVersion}} {{.Driver}} {{.DriverStatus}}'
          docker info --format '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}' \
            | grep -qx 'io.containerd.snapshotter.v1'
      - name: Pre-pull the registry image
        run: docker pull registry:2
      - name: E2E (real daemon, containerd image store)
        env:
          GANTRY_E2E_REGISTRY: registry:2
        run: |
          set -euo pipefail
          go test -tags e2e -race -v -run 'TestL2DigestAs' ./internal/e2e/... | tee l2.txt
          grep -q -- '--- PASS: TestL2DigestAsInThePullsOwnRepository' l2.txt

  # containerd image-store features (digest `as`, anchored pull) that otherwise
  # only run in the devcontainer: provision containerd on the runner and let the
  # existing internal/down containerd integration tests stop self-skipping.
  e2e-containerd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start containerd
        run: |
          sudo systemctl start containerd || (sudo apt-get update && sudo apt-get install -y containerd && sudo systemctl start containerd)
          sudo chmod 666 /run/containerd/containerd.sock
      - name: E2E (containerd)
        env:
          CONTAINERD_ADDRESS: /run/containerd/containerd.sock
          CONTAINERD_NAMESPACE: gantry
        run: go test -race ./internal/down/...

  # Compile the release binaries ONCE. The Dockerfile's `build` stage cross-builds
  # both arches (GOARCH=amd64 and GOARCH=arm64) in a single run, so there is no
  # reason to repeat it per architecture — bake once here and hand ./dist
  # (amd64 + arm64 + the CA bundle) to the per-arch `verify` jobs as an artifact.
  # It only needs the source, so it runs immediately, in parallel with the tests;
  # `verify` (which tests the artifact and pushes) is what gates on them.
  dist:
    runs-on: ubuntu-latest
    env:
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Cross-compile the release binaries (./dist)
        uses: docker/bake-action@v7
        with:
          source: .
          targets: build
          set: |
            *.cache-from=type=gha,scope=build
            *.cache-to=type=gha,mode=max,scope=build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Assemble the FROM-scratch image for one architecture from the prebuilt ./dist
  # (a COPY-only stage — no recompile, no qemu) on a native runner, then black-box
  # the real artifact: L3 against the ./dist/<arch> binary (GANTRY_E2E_BIN) and the
  # L3 image tier against the loaded image (GANTRY_E2E_IMAGE). Pure test — it never
  # touches the registry; `promote` is the only pusher. Needs the whole source gate
  # too, so promotion waits until unit/L1/L2/containerd are green; the in-Dockerfile
  # `test` stage (no -race) is therefore not rebaked here.
  verify:
    needs: [dist, test, e2e-docker, e2e-docker-containerd-store, e2e-containerd]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: Pre-pull the registry image
        run: docker pull registry:2
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # upload-artifact does not preserve the executable bit; restore it so both
      # the binary L3 and the image's COPY'd entrypoint are runnable.
      - name: Restore exec bit
        run: chmod +x dist/${{ matrix.arch }}

      - name: Assemble image and load for testing
        uses: docker/bake-action@v7
        with:
          source: .
          targets: app
          set: |
            app.platform=${{ matrix.platform }}
            app.tags=gantry-ci:${{ matrix.arch }}
            app.output=type=docker

      - name: E2E L3 (release binary + scratch image)
        env:
          GANTRY_E2E_BIN: ${{ github.workspace }}/dist/${{ matrix.arch }}
          GANTRY_E2E_IMAGE: gantry-ci:${{ matrix.arch }}
        run: go test -tags e2e -run TestL3 ./internal/e2e/...

  # Build the shippable multi-arch image from the tested ./dist and push it with
  # every tag in one shot. `app` is a COPY-only scratch stage, so both arches build
  # from the single ./dist context on one amd64 runner with no qemu, and the pushed
  # binaries are byte-for-byte the ones `verify` black-boxed. Runs only after both
  # verify legs pass, so nothing is published until the real artifact is green.
  # `edge` tracks the latest promoted build.
  #
  # EVERY run publishes an image; only main moves the release names.
  #
  # A pull request here needs something a robot can run, because the question
  # "does the fleet still work with this?" is not answerable from this
  # repository. robot-platform's harness takes GANTRY_IMAGE and stands the
  # fleet's OTA path up against a candidate before anything pins it. Without an
  # image for a branch that loop was merge, pin, then find out -- which is how
  # #21, #24 and #25 each went red after they had already landed, and #26 is
  # the third try at one defect for exactly that reason.
  #
  # A branch image is a dead end on purpose: one name, under a prefix no
  # release uses. `:r<run-id>` alone would not do -- docker-bake.hcl gives
  # every main build that same form, so a pinned `:r…` would stop telling you
  # whether the build behind it went through main. `:pr7-r123` cannot be
  # mistaken for one, and it is also what makes the tags droppable when the
  # pull request closes (ci-sweep.yaml).
  promote:
    needs: verify
    # A fork's token is read-only, so there is nothing to push with. Its pull
    # request is still built and verified by every job above this one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      REPO: ghcr.io/lesomnus/gantry
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
      RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Restore exec bit
        run: chmod +x dist/amd64 dist/arm64
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release names, straight off docker-bake.hcl: `edge`, the run and
      # the date.
      - name: Build and push the multi-arch image
        if: env.RELEASE == 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64,linux/arm64
            app.output=type=registry

      # `pr<N>` for a pull request, the branch otherwise -- a dispatch on a
      # topic branch is the same kind of build and wants the same kind of name.
      # A tag takes no slashes, so a branch's go.
      - name: Whose build this is
        id: whose
        if: env.RELEASE != 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "${PR:-}" ]; then
            whose="pr${PR}"
          else
            whose=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')
          fi
          echo "tag=${whose}-${BUILD_ID}" >> "$GITHUB_OUTPUT"

      # One name, replacing the target's list. `--set app.tags=` overwrites it
      # rather than adding to it, so `edge` and the dated names cannot move
      # from here -- checked with `bake --print`, not assumed.
      - name: Build and push an image to ask about
        if: env.RELEASE != 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64,linux/arm64
            app.output=type=registry
            app.tags=ghcr.io/lesomnus/gantry:${{ steps.whose.outputs.tag }}

      - name: Inspect the pushed manifest
        env:
          WHOSE: ${{ steps.whose.outputs.tag }}
        run: |
          if [ "${RELEASE}" = "true" ]; then
            docker buildx imagetools inspect "${REPO}:${TAG}"
          else
            docker buildx imagetools inspect "${REPO}:${WHOSE}"
            echo "::notice::ask the fleet about this one: GANTRY_IMAGE=${REPO}:${WHOSE}"
          fi
