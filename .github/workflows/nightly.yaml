# The heavy, opt-in E2E tier: provision the full registry matrix (plain-HTTP +
# TLS + zot + pull-through proxy) with Ansible on a self-hosted runner, then run
# the L3-infra tests against it. Scheduled + manual only — never gates a push.
#
# Requires a self-hosted runner labelled `gantry-e2e` with docker, containerd,
# ansible, and a Go toolchain.
name: nightly

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e-infra:
    runs-on: [self-hosted, gantry-e2e]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Provision + run the L3-infra suite
        run: make e2e-infra
      - name: Tear down the environment
        if: always()
        run: make e2e-down
