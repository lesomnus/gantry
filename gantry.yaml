# OpenTelemetry pipeline (mkot-style). Instruments record to a no-op unless an
# exporter is wired to a provider here — exporting is a deployment opt-in. The
# `otlp` exporter (github.com/lesomnus/mkot/otlp) pushes over OTLP/gRPC (e.g.
# to a node-local collector). Every provider automatically carries the gantry
# service resource (service.name).
# otel:
#   exporters:
#     otlp:
#       endpoint: "127.0.0.1:4317"
#       tls: { insecure: true }    # plaintext; omit for TLS w/ system roots
#       # headers:
#       #   - { name: authorization, value: "Bearer ..." }
#       # interval: 60s            # metric push period
#       # temporality: delta       # cumulative (default) | delta
#       # retry_on_failure: { max_elapsed_time: 1m }
#   providers:
#     meter:  { exporters: [otlp] }
#     tracer: { exporters: [otlp] }

# Image stores a job can move images between, keyed by name (order does not
# matter). kind "oci" is an OCI distribution registry gantry reads/writes;
# kind "docker"/"containerd" is a daemon that pulls. A job moves `source` (oci)
# -> `target`: an oci registry (gantry copies the blobs in) or an engine (the
# daemon is told to pull — empty `platforms` uses the daemon host's platform).
# Top-level: shared by every subcommand, not nested under `serve`.
stores:
  # Source registry (remote). host defaults to the store name when omitted.
  docker.io: { kind: "oci" }

  # Private registry reached with mutual TLS. `cred` is the client credential
  # gantry presents for every outbound request to this registry, including the
  # bearer-token exchange; `cred.kind` selects where the private key lives.
  #
  # kind "tpm": the key is sealed in a TPM and never leaves the device.
  # internal:
  #   kind: "oci"
  #   host: "registry.internal"
  #   cred:
  #     kind: "tpm"
  #     device: "/dev/tpmrm0"       # TPM device (default; omit to use it)
  #     handle: "0x81000001"        # persistent handle of the client key
  #     cert: "/etc/gantry/device.crt"  # client cert (leaf + chain), PEM; its
  #                                     # public key must match the TPM key
  #   ca_cert: "/etc/gantry/ca.crt"     # verify the registry/token server
  #                                     # (usable on its own, without cred)
  #
  # kind "file": an ordinary PEM key pair on disk.
  # internal-file:
  #   kind: "oci"
  #   host: "registry.internal"
  #   cred:
  #     kind: "file"
  #     cert: "/etc/gantry/client.crt"  # client cert (leaf + chain), PEM
  #     key: "/etc/gantry/client.key"   # private key, PEM (PKCS#8 / EC / RSA)
  #   ca_cert: "/etc/gantry/ca.crt"

  # A registry that holds copies of another one's content — a site registry in
  # front of a cloud one. Declared on the store being cached, so it is stated once
  # per origin rather than repeated per destination. gantry may then satisfy a job
  # that reads from `docker.io` by going through `site` instead, filling it first
  # if it does not already hold the image: the origin is read once rather than
  # once per destination. The caller neither names `site` nor sees a different
  # result. See docs/stores.md#routing-a-copy-through-a-cache.
  #   docker.io: { kind: "oci", cache: "site" }
  # site: { kind: "oci", host: "registry.corp.internal", username: gantry, password: "..." }

  # Cache registry gantry fills and engines pull from.
  cache:
    kind: "oci"
    host: "registry.cache.local"
    insecure: true            # plain-HTTP / self-signed
    mode: "copy"              # copy = push blobs; proxy = read-through self-fill
    # Registry credentials (optional). These apply to THIS store — copy-mode push
    # and proxy-mode pull. In copy mode the UPSTREAM `source` pull authenticates
    # via the docker keychain (~/.docker/config.json), not these fields.
    # username: ""
    # password: ""
    # Override the host engines are told to pull from when they reach this
    # registry by a different (trusted) name. e.g. push to an IP but have
    # daemons pull a name. Per-store pull_host wins.
    # downstream_host: "cache.cr.com"
    # The in-store reference is the source repo/tag under this store's host:
    # docker.io/library/redis:7 -> <host>/library/redis:7.

  # Engine stores (daemons triggered to pull). Optional pull_host overrides the
  # cache host in the reference this engine pulls.
  # nomad: { kind: "docker", address: "/var/run/docker.sock" }
  # k3s:
  #   kind: "containerd"
  #   address: "/run/k3s/containerd/containerd.sock"
  #   namespace: "k8s.io"
  #   pull_host: "cache.cr.com"
  #   # Image GC for THIS engine store (retention is per-store; there is no global
  #   # retention policy). gantry tracks last-used time from container events and
  #   # reclaims images per the rules below.
  #   retention:
  #     path: "/var/lib/gantry/k3s.db"  # this store's bbolt index (required)
  #     interval: "1h"                  # scheduler idle cap (default 1h)
  #     min_interval: "1m"              # debounce between GC runs (default 1m)
  #     grace: "1h"                     # hold off deletion after startup (default 1h)
  #     heartbeat: "5m"                 # periodic in-use scan stamping last-used, so
  #                                     # a long-running container's image survives
  #                                     # age GC even if its start event was missed
  #                                     # (default 5m; "0s" disables)
  #     # docker stores only (containerd reclaims untagged content itself and
  #     # rejects this key): reap an image this long after it is first observed
  #     # with NO tags — e.g. the old image of a re-pulled tag. Default "1h",
  #     # i.e. ON whenever retention is enabled on a docker store; "0s" turns it
  #     # off. Every GC pass also takes a full inventory scan of the daemon, so
  #     # images pulled or untagged out-of-band still converge on these rules.
  #     # untagged_after: "1h"
  #     # Per-repo rules. For a repo, the matching patterns are resolved field by
  #     # field: each field takes the value from the most specific matching rule
  #     # that sets it (longest literal prefix wins); pins are the union of all
  #     # matching rules. A repo matching no rule is left unmanaged (never GC'd).
  #     rules:
  #       - repo: "**"                       # catch-all defaults (least specific)
  #         max_age: "168h"                  # delete if unused for 7d (keep_n protects)
  #         keep_n: 2                        # keep the 2 most-recent images per repo
  #         max_n: 10                        # cap at 10 images per repo (oldest deleted)
  #                                          # keep_n/max_n count by digest (shared
  #                                          # tags count once)
  #         max_idle: "2160h"                # HARD cap: delete if unused 90d even if
  #                                          # in keep_n (only in-use/pins protect)
  #       - repo: "cache.cr.com/prod/**"     # prod: overrides only what it sets
  #         max_age: "2160h"                 # 90d; keep_n/max_n inherited from **
  #         pins: ["*:stable"]               # never GC stable tags here
  #       - repo: "cache.cr.com/prod/critical"  # most specific: exact repo
  #         keep_n: 20

# Job worker pool that runs image moves. Top-level, not nested under `serve`.
worker:
  # Max jobs run at once (tier-1 worker pool).
  max_concurrent_jobs: 2
  # Max layers moved at once during a job's registry copy (tier-2).
  max_concurrent_layers: 4
  # Buffered depth of the pending-job queue; a full queue rejects the job
  # (RESOURCE_EXHAUSTED).
  queue_size: 256
  # How long a finished job's record is kept before eviction.
  job_ttl: "30m"
  # Default for a job that does not set `fallback_to_origin`: when an engine
  # pull's source cannot serve the image, pull it from the registry named in
  # the job's ref instead of failing — a cache becomes an optimization rather
  # than a dependency. See docs/stores.md#falling-back-to-the-origin.
  fallback_to_origin: false
  # How long an engine pull that its source could not serve waits for an active
  # job filling that source with exactly this image, before giving up on it.
  # Costs nothing when the source can serve the image — the wait happens only
  # after a real miss. 0 disables waiting.
  source_wait: "0s"
  # Default for a job that does not set `require_authority`: refuse a job whose
  # source could not confirm what its tag means, instead of reading a nearer cache
  # of that store on faith. Only consulted for a job gantry routed through such a
  # cache. Default false — a cache that keeps working while the registry behind it
  # does not is usually the point of having one.
  require_authority: false
  # Bounds the registry requests admission makes before a job is created: settling
  # a tag at its authority and probing a cache for the digest. An unresponsive
  # registry then delays one submit rather than holding it open indefinitely.
  admission_timeout: "10s"

# Server configuration (used by the `serve` subcommand).
serve:
  # The gRPC listen address.
  addr: ":8080"
  shutdown_grace: "15s"

  # Authentication for every RPC (the standard health and reflection
  # services are exempt). Clients send `authorization: Bearer <token>`. Serve the
  # API over TLS with tls_cert/tls_key, or terminate TLS/mTLS at a reverse proxy.
  # auth:
  #   tokens: ["${GANTRY_TOKEN}"]
  #   tls_cert: "/etc/gantry/server.crt"
  #   tls_key:  "/etc/gantry/server.key"

  # Allow a job's source/target to name a bare registry host not declared below.
  # Default false: only declared stores may be used. (A bare host that matches a
  # declared store's `host` still resolves even when this is false.)
  allow_unknown_stores: false

  # Per-store health probe (StoreService.Health). An engine store is probed
  # with its daemon ready-check; a registry store with a GET /v2/ ping
  # (a 200 or a 401 auth challenge both count as reachable). Results are cached
  # so frequent polling (load balancers, dashboards) does not hammer backends.
  health:
    # How long a probe result is reused before the next call re-probes.
    cache_ttl: "5s"
    # Deadline for a single probe (a hung backend fails at this bound).
    probe_timeout: "3s"
    # Store names the gRPC health readiness (grpc.health.v1.Health) gates on;
    # empty = every engine store. List a registry here (e.g. the local cache)
    # to make its reachability gate readiness — remote upstreams should stay
    # out so WAN blips don't flap it.
    # ready_stores: ["cache"]

  # Image retention / garbage collection is configured PER ENGINE STORE, under
  # stores.<name>.retention (see the k3s example above) — there is no global
  # retention policy. Within a store, rules are matched per repo; for each repo
  # the eviction order is:
  #   1. in_use         - an image a running container references
  #   2. pinned         - matches a rule `pins` entry or an API pin (exact ref, or
  #                       a doublestar pattern tried against the full ref,
  #                       name:tag, and the bare tag)
  #   3. idle_exceeded  - unused longer than `max_idle`: deleted regardless of
  #                       keep_n/max_n (a hard cap; only in_use/pinned protect)
  #   4. max_n cap      - keep only the max_n most-recent tags in the repo; the
  #                       oldest beyond the cap are deleted (reason max_n_exceeded)
  #                       even if still within max_age
  #   5. keep_n_recent  - the keep_n most-recently-used tags
  #   6. within_max_age - last used more recently than `max_age`
  # A repo matching no rule is left unmanaged (never deleted); anything else is
  # deleted (held only by the store's post-startup `grace` window).

  # Audit log (EventService): an append-only ring of operationally significant
  # events (jobs admitted/finished, GC applied, manual pull/remove, pins) that
  # survive process restart — the durable record the in-memory job store cannot
  # provide. Independent of retention, so it works even when GC is disabled.
  # events:
  #   path: "/var/lib/gantry/events.db"   # bbolt file; empty disables the log
  #   cap: 10000                          # max entries retained (oldest evicted)

  # Source-image signature verification (Notary Project / notation). When enabled,
  # gantry verifies the `source` image's signature at job creation; a failure rejects
  # the job (gRPC FAILED_PRECONDITION) and nothing is created. Disabled unless a
  # `mode` is set here or on a source store (stores.<name>.verify.mode) — a per-store
  # mode enables verification for that registry even when this global mode is unset.
  #
  # Trust model (important): there is no OS/system-root fallback. You must supply
  # the CA cert(s) you trust in `trust_store`; without it the server refuses to
  # start (fail-fast) rather than accepting attacker signatures. With just a
  # trust_store, gantry synthesizes a policy that trusts ANY signature chaining to
  # those CAs (any identity) — supply your own `trust_policy` to pin scopes/identities.
  # verify:
  #   # off | verify-if-present (verify when signed, allow unsigned) | require
  #   # (signature mandatory — reject unsigned AND invalid). Global default.
  #   mode: "require"
  #   # Directory of trusted CA certificate files (PEM: *.crt/*.pem/*.cert/*.cer). Required.
  #   trust_store: "/etc/gantry/verify/ca"
  #   # Optional notation trust policy JSON. When omitted, gantry synthesizes one
  #   # (registryScopes ["*"], trustedIdentities ["*"], the level below) referencing
  #   # the CA store above. Provide this to restrict trusted identities/registries.
  #   # trust_policy: "/etc/gantry/verify/trustpolicy.json"
  #   # Verification level for the synthesized policy: strict (default) enforces
  #   # cert expiry+revocation; permissive downgrades those to warnings. ("audit"
  #   # is rejected — it disables trust-anchor enforcement, defeating the gate.)
  #   level: "strict"
  #   # Per-verification deadline (registry resolve + signature fetch + verify).
  #   timeout: "15s"
  #   # provider: "notation"   # only notation is supported
  #   # Offline signature source for bootstrap / air-gapped images: an on-disk OCI
  #   # image layout (subject manifests + signature referrers; image layers are NOT
  #   # needed to verify). Consulted BEFORE the live registry and verified against
  #   # the SAME trust_store, so it is unspoofable by naming and works when the
  #   # registry is unreachable. A trusted hit returns offline; a miss falls through.
  #   # local_layout: "/etc/gantry/verify/layout"
  #   # Durable verdict cache (bbolt): admission verification writes a per-content-
  #   # digest verdict here, and runtime enforcement (serve.enforce, below) reads it
  #   # offline — so a decision survives a registry outage. REQUIRED when
  #   # serve.enforce is enabled. Path must differ from every retention/events file.
  #   # cache:
  #   #   path: "/var/lib/gantry/verify-cache.db"
  #   #   ttl: "4w"       # hard max-age of a verdict (default 4w; w/d units accepted)
  #   #   refresh: "2w"   # soft revalidation age: re-verified past this, usable until ttl

  # Per-source-registry override: set verify.mode on an oci store to require
  # signing on some registries and relax it on others (in the top-level
  # `stores:` map), e.g.
  #   stores:
  #     dockerhub:    { kind: "oci", verify: { mode: "require" } }
  #     internal-ci:  { kind: "oci", verify: { mode: "off" } }

  # Runtime signature enforcement ("quarantine"). Whereas serve.verify gates what
  # gantry COPIES, serve.enforce gates what an engine RUNS: gantry watches each
  # listed engine store's container-start events and force-removes (docker rm -f)
  # any container whose image is not signed by a trusted Root CA (the same
  # serve.verify.trust_store), then removes the image. Post-hoc quarantine — the
  # container is already running when its start event fires, so a very short-lived
  # container may finish before it is killed; this is NOT admission control.
  #
  # The verdict is keyed on the image's content digest and resolved in order:
  # the durable cache (offline), a live verification (which also consults
  # local_layout), then on_unavailable. Requires serve.verify.cache (offline
  # verdicts) and serve.verify.trust_store; enabling it also builds the verifier
  # even when serve.verify.mode is off.
  #
  # There is deliberately NO image-name allowlist — an image name is attacker-
  # chosen and is not a security boundary. Images that must run offline should be
  # signed and placed in serve.verify.local_layout; gantry never removes its own
  # container (identified by container id, never by image name).
  # enforce:
  #   mode: "quarantine"          # off (default) | quarantine
  #   stores: ["nomad"]           # engine stores (docker; containerd not yet) to police
  #   on_unavailable: "grace"     # when no verdict is obtainable and none is cached:
  #                               #   grace (default) — honor a known-but-expired
  #                               #     trusted verdict, else allow-and-log
  #                               #   kill  — fail closed (remove it)
  #                               #   allow — allow on doubt
  #   # self_container: ""        # gantry's own container id/name so it never removes
  #                               # itself; empty falls back to hostname then cgroup
  #                               # (or set the GANTRY_SELF_ID env)
