# Greeting configuration (used by the `greet` subcommand).
greet:
  # Format string; %s is replaced with the name argument.
  format: "Hello, %s!"

# OpenTelemetry pipeline (mkot-style). Instruments record to a no-op unless an
# exporter is wired to a provider here — exporting is a deployment opt-in. The
# `otlp` exporter (github.com/lesomnus/mkot/otlp) pushes over OTLP/gRPC (e.g.
# to a node-local collector). Every provider automatically carries the gantry
# service resource (service.name).
# otel:
#   exporters:
#     otlp:
#       endpoint: "127.0.0.1:4317"
#       tls: { insecure: true }    # plaintext; omit for TLS w/ system roots
#       # headers:
#       #   - { name: authorization, value: "Bearer ..." }
#       # interval: 60s            # metric push period
#       # temporality: delta       # cumulative (default) | delta
#       # retry_on_failure: { max_elapsed_time: 1m }
#   providers:
#     meter:  { exporters: [otlp] }
#     tracer: { exporters: [otlp] }

# Image stores a job can move images between, keyed by name (order does not
# matter). kind "oci" is an OCI distribution registry gantry reads/writes;
# kind "docker"/"containerd" is a daemon gantry triggers to pull. A job copies
# `from` (oci) -> `to` (oci), then the `distribute` engines pull it.
# Top-level: shared by every subcommand, not nested under `serve`.
stores:
  # Source registry (remote). host defaults to the store name when omitted.
  docker.io: { kind: "oci" }

  # Private registry reached with mutual TLS whose client key is sealed in a TPM.
  # gantry presents the client certificate — and signs the TLS handshake with the
  # TPM-held key — for every outbound request to this registry, including the
  # bearer-token exchange. The key never leaves the device.
  # internal:
  #   kind: "oci"
  #   host: "registry.internal"
  #   tpm: "/dev/tpmrm0"            # TPM device (default; omit to use it)
  #   tpm_handle: "0x81000001"     # persistent handle of the client key
  #   tpm_cert: "/etc/gantry/device.crt"  # client cert (leaf + chain), PEM; its
  #                                        # public key must match the TPM key
  #   ca_cert: "/etc/gantry/ca.crt"       # verify the registry/token server
  #                                        # (usable on its own, without TPM)

  # Cache registry gantry fills and engines pull from.
  cache:
    kind: "oci"
    host: "registry.cache.local"
    insecure: true            # plain-HTTP / self-signed
    mode: "copy"              # copy = push blobs; proxy = read-through self-fill
    # Override the host engines are told to pull from when they reach this
    # registry by a different (trusted) name. e.g. push to an IP but have
    # daemons pull a name. Per-store pull_host wins.
    # downstream_host: "cache.cr.com"
    # source ref -> ref in this registry (ordered, first match wins; quote both).
    rewrite:
      - { "**": "{{.CacheHost}}/{{.Repo}}" }

  # Engine stores (daemons triggered to pull). Optional pull_host overrides the
  # cache host in the reference this engine pulls.
  # nomad: { kind: "docker", address: "/var/run/docker.sock" }
  # k3s: { kind: "containerd", address: "/run/k3s/containerd/containerd.sock", namespace: "k8s.io", pull_host: "cache.cr.com" }

# Job worker pool that runs image moves. Top-level, not nested under `serve`.
worker:
  # Fallback platforms when a job omits them; empty = host GOOS/GOARCH only.
  platforms: ["linux/amd64", "linux/arm64"]
  # Max jobs run at once (tier-1 worker pool).
  max_concurrent_jobs: 2
  # Max layers moved at once during a job's registry copy (tier-2).
  max_concurrent_layers: 4
  # Buffered depth of the pending-job queue; a full queue returns 503.
  queue_size: 256
  # How long a finished job's record is kept before eviction.
  job_ttl: "30m"
  # When a job omits `distribute`, fan out to all engine stores.
  distribute_by_default: false

# Server configuration (used by the `serve` subcommand).
serve:
  addr: ":8080"
  shutdown_grace: "15s"

  # Authentication for /v1/* (/healthz is exempt).
  # auth:
  #   tokens: ["${GANTRY_TOKEN}"]
  #   client_ca: "/etc/gantry/ca.pem"

  # Allow a job's from/to to name a bare registry host not declared below.
  # Default false: only declared stores may be used.
  allow_unknown_stores: false

  # Per-store health probe (GET /v1/store/{name}/health). An engine store is
  # probed with its daemon ready-check; a registry store with a GET /v2/ ping
  # (a 200 or a 401 auth challenge both count as reachable). Results are cached
  # so frequent polling (load balancers, dashboards) does not hammer backends.
  health:
    # How long a probe result is reused before the next call re-probes.
    cache_ttl: "5s"
    # Deadline for a single probe (a hung backend fails at this bound).
    probe_timeout: "3s"
    # Store names GET /readyz gates on; empty = every engine store. List a
    # registry here (e.g. the local cache) to make its reachability gate
    # readiness — remote upstreams should stay out so WAN blips don't flap it.
    # ready_stores: ["cache"]

  # Image retention / garbage collection on engine stores. Disabled unless
  # `path` is set. gantry tracks each image's last-used time from the engine's
  # own container events (plus a cold-start seed and a distribute fallback),
  # persists it to the bbolt index at `path`, and reclaims space on a schedule.
  #
  # Eviction order (a record is kept by the first rule that matches):
  #   1. in_use         - an image a running container references
  #   2. pinned         - matches a `pins` entry or an API pin (exact ref, or a
  #                       doublestar pattern tried against the full ref,
  #                       name:tag, and the bare tag)
  #   3. max_n cap      - of the rest, only the max_n most-recent tags *per repo*
  #                       survive; the oldest beyond the cap are deleted (reason
  #                       max_n_exceeded) even if still within max_age
  #   4. keep_n_recent  - the N most-recently-used tags *per repository*
  #   5. within_max_age - last used more recently than `max_age`
  # Anything else is deleted (held only by the post-startup `grace` window).
  # retention:
  #   # bbolt index file (persists last-used + pins across restarts).
  #   path: "/var/lib/gantry/retention.db"
  #   # Delete images whose last-used age exceeds this; omit/0 disables age GC.
  #   max_age: "720h"          # 30 days
  #   # Keep the N most-recently-used tags per repo, even if older than max_age.
  #   keep_n: 3
  #   # Cap the tags kept per repo: when a repo exceeds max_n non-protected (not
  #   # in-use, not pinned) tags, the oldest beyond the cap are deleted even before
  #   # max_age. Must be >= keep_n. Deferred during the grace window. 0 disables.
  #   max_n: 20
  #   # Never collected (in addition to the pin API): exact refs or doublestar
  #   # patterns (e.g. "*:stable" pins every stable tag).
  #   pins:
  #     - "registry.cache.local/lesomnus/a:stable"
  #   # Scheduler idle cap: the longest gantry waits between GC checks. It wakes
  #   # earlier when a record is about to age out or a usage event arrives, and
  #   # stays idle here when nothing is on an age path. Default 1h.
  #   interval: "1h"
  #   # Debounce floor between GC runs (absorbs event bursts). Default 1m.
  #   min_interval: "1m"
  #   # Hold off age-based deletion this long after startup (usage history is lost
  #   # during downtime). Defaults to max_age.
  #   grace: "1h"

  # Audit log (GET /v1/event): an append-only ring of operationally significant
  # events (jobs admitted/finished, GC applied, manual pull/remove, pins) that
  # survive process restart — the durable record the in-memory job store cannot
  # provide. Independent of retention, so it works even when GC is disabled.
  # events:
  #   path: "/var/lib/gantry/events.db"   # bbolt file; empty disables the log
  #   cap: 10000                          # max entries retained (oldest evicted)

  # Source-image signature verification (Notary Project / notation). When enabled,
  # gantry verifies the `from` image's signature at job creation; a failure rejects
  # the job (422) and nothing is created. Disabled unless `mode` is set.
  #
  # Trust model (important): there is no OS/system-root fallback. You must supply
  # the CA cert(s) you trust in `trust_store`; without it the server refuses to
  # start (fail-fast) rather than accepting attacker signatures. With just a
  # trust_store, gantry synthesizes a policy that trusts ANY signature chaining to
  # those CAs (any identity) — supply your own `trust_policy` to pin scopes/identities.
  # verify:
  #   # off | verify-if-present (verify when signed, allow unsigned) | require
  #   # (signature mandatory — reject unsigned AND invalid). Global default.
  #   mode: "require"
  #   # Directory of trusted CA certificate files (PEM: *.crt/*.pem/*.cert). Required.
  #   trust_store: "/etc/gantry/verify/ca"
  #   # Optional notation trust policy JSON. When omitted, gantry synthesizes one
  #   # (registryScopes ["*"], trustedIdentities ["*"], the level below) referencing
  #   # the CA store above. Provide this to restrict trusted identities/registries.
  #   # trust_policy: "/etc/gantry/verify/trustpolicy.json"
  #   # Verification level for the synthesized policy: strict (default) enforces
  #   # cert expiry+revocation; permissive downgrades those to warnings. ("audit"
  #   # is rejected — it disables trust-anchor enforcement, defeating the gate.)
  #   level: "strict"
  #   # Per-verification deadline (registry resolve + signature fetch + verify).
  #   timeout: "15s"
  #   # provider: "notation"   # only notation is supported

  # Per-source-registry override: set verify.mode on an oci store to require
  # signing on some registries and relax it on others (in the top-level
  # `stores:` map), e.g.
  #   stores:
  #     dockerhub:    { kind: "oci", verify: { mode: "require" } }
  #     internal-ci:  { kind: "oci", verify: { mode: "off" } }
