# Greeting configuration (used by the `greet` subcommand).
greet:
  # Format string; %s is replaced with the name argument.
  format: "Hello, %s!"

# Server configuration (used by the `serve` subcommand).
serve:
  addr: ":8080"
  shutdown_grace: "15s"

  # Authentication for /v1/* (/healthz is exempt).
  # auth:
  #   tokens: ["${GANTRY_TOKEN}"]
  #   client_ca: "/etc/gantry/ca.pem"

  # Cache registry. copy mode pushes upstream -> cache; proxy mode triggers self-fill.
  registry:
    mode: "copy"
    host: "registry.cache.local"
    insecure: true
    # Override the registry host that downstream targets are told to pull, when
    # they reach the cache by a different (trusted) name than `host`. e.g. push
    # to "192.168.0.22:5000" but have daemons pull "cache.cr.com". Per-target
    # pull_host wins. Empty = downstreams pull the same ref gantry warmed.
    # downstream_host: "cache.cr.com"
    # source ref -> cache ref (ordered, first match wins; quote both sides).
    rewrite:
      - { "**": "{{.CacheHost}}/{{.Repo}}" }

  # Warming behavior.
  warm:
    # Fallback platforms when a warm request omits them; empty = host GOOS/GOARCH only.
    platforms: ["linux/amd64", "linux/arm64"]
    # Max images warmed at once (tier-1 worker pool).
    max_concurrent_jobs: 2
    # Max layers pulled at once within a single image (tier-2).
    max_concurrent_layers: 4
    # Buffered depth of the pending-job queue; a full queue returns 503.
    queue_size: 256
    # How long a finished job's record is kept before eviction.
    job_ttl: "30m"
    # Fan out to downstream targets after warming, by default.
    trigger_downstream: true

  # Downstream daemons to trigger after warming. Optional per-target pull_host
  # overrides the cache host in the reference this target pulls.
  # targets:
  #   - { name: "nomad-docker", kind: "docker", address: "/var/run/docker.sock" }
  #   - { name: "k3s", kind: "containerd", address: "/run/k3s/containerd/containerd.sock", namespace: "k8s.io", pull_host: "cache.cr.com" }
