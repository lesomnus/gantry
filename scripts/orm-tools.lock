# The protobuf-orm generators that reproduce this repository's committed
# generated output, one "<repository> <commit>" per line.
#
# The generators are separate repositories on their own release schedule, and
# their output is committed here. Building whatever the local checkout happens
# to be at makes the pipeline produce something else -- a newer one adds RPCs
# and moves field numbers, which is a change to gantry's contract rather than a
# regeneration of it. So scripts/gen-proto.sh builds these commits out of the
# checkout's object store (`git archive`) and never looks at its working tree.
#
# To take a newer generator: bump the line, run scripts/gen-proto.sh, and read
# the diff -- it is the contract change, and it belongs in the same commit as
# the bump. `git -C $ORM_ROOT/<repository> fetch` first if the commit is not
# there yet.

