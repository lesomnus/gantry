edition = "2023";
package gantry;

import "gantry/job.proto";
import "gantry/store_svc.g.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lesomnus/gantry/pb";

service JobService {
  // Add creates a new Job
  rpc Add(JobAddRequest) returns (Job);
  // Get retrieves a Job
  rpc Get(JobGetRequest) returns (Job);
  // Patch updates an existing Job
  rpc Patch(JobPatchRequest) returns (Job);
  // Erase deletes a Job
  rpc Erase(JobRef) returns (google.protobuf.Empty);
  // List returns jobs newest-first.
  rpc List(JobListRequest) returns (JobListResponse);
  // Watch streams snapshots of the job as its transfers progress and ends
  // after the snapshot that carries a terminal state. The gRPC counterpart
  // of the REST SSE endpoint GET /v1/job/{id}/progress.
  rpc Watch(JobRef) returns (stream Job);
  // Plan runs admission for a would-be job without submitting it: store
  // binding, rewrite, verification, and coalescing are all evaluated.
  rpc Plan(JobPlanRequest) returns (JobPlanResponse);
  // Cancel stops a running job but keeps its record for inspection; the
  // returned snapshot is taken right after the cancel is signaled.
  rpc Cancel(JobRef) returns (Job);
  // Retry re-submits a terminal job's original request as a new job, with
  // fresh resolution and verification.
  rpc Retry(JobRef) returns (Job);
}

message JobAddRequest {
  string id = 1;
  string ref = 2 [features.field_presence = IMPLICIT];
  StoreRef source = 3;
  StoreRef target = 4;
  repeated string platforms = 5;
  bool copy_referrers = 6;
  repeated string as = 14;
  map<string, string> labels = 15;
  JobState state = 7 [features.field_presence = IMPLICIT];
  string error = 8 [features.field_presence = IMPLICIT];
  Verification verification = 9;
  repeated Transfer transfers = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
}

message JobGetRequest {
  JobRef ref = 1;
  JobSelect select = 2;
}

message JobRef {
  oneof key {
    string id = 1;
  }
}

message JobSelect {
  bool all = 1;
  bool ref = 2;
  StoreSelect source = 3;
  StoreSelect target = 4;
  bool platforms = 5;
  bool copy_referrers = 6;
  bool as = 14;
  bool labels = 15;
  bool state = 7;
  bool error = 8;
  bool verification = 9;
  bool transfers = 10;
  bool created_at = 11;
  bool started_at = 12;
  bool ended_at = 13;
}

message JobPatchRequest {
  JobRef ref = 1;
  map<string, string> labels = 29;
  JobState state = 13;
  string error = 15;
  Verification verification = 17;
  bool verification_null = 18;
  repeated Transfer transfers = 19;
  google.protobuf.Timestamp started_at = 23;
  google.protobuf.Timestamp ended_at = 25;
}

message JobListRequest {
  JobState state = 1;
  // Substring match on the requested ref.
  string ref = 2;
  // Jobs created at or after this instant.
  google.protobuf.Timestamp since = 3;
  // Label selector: a job matches when it carries every key with the given
  // value (subset match). An empty map matches everything.
  map<string, string> labels = 4;

  int32 page_size = 10;
  string page_token = 11;
}

message JobListResponse {
  repeated Job items = 1;
  string next_page_token = 2;
}

// The same inputs as JobAddRequest, evaluated without submitting.
message JobPlanRequest {
  string ref = 1;
  StoreRef source = 2;
  StoreRef target = 3;
  repeated string platforms = 4;
  bool copy_referrers = 5;
  // Engine target only: names the image would be recorded under.
  repeated string as = 6;
}

message JobPlanResponse {
  // Resolved source and target store names.
  string source = 1;
  string target = 2;
  // Source-side ref, digest-pinned when verified.
  string source_ref = 3;
  // Target-side ref: the rewritten cache ref, or the ref the engine
  // is told to pull.
  string target_ref = 4;
  // Registry target: empty = all platforms; engine target: the
  // single platform pulled.
  repeated string platforms = 5;
  bool copy_referrers = 6;
  Verification verification = 7;
  // The active job an identical submit would coalesce onto, if any.
  string coalesces = 8;
  // Engine target: the (normalized) names the image is recorded under.
  repeated string as = 9;
}
