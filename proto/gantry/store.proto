edition = "2023";

package gantry;

import "orm.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/gantry/pb";

enum StoreKind {
  STORE_KIND_UNSPECIFIED = 0;
  STORE_KIND_OCI = 1; // OCI registry: gantry reads/writes blobs.
  STORE_KIND_DOCKER = 2; // Docker engine: the daemon pulls.
  STORE_KIND_CONTAINERD = 3; // containerd engine: the daemon pulls.
  // Meta store: a policy, not a place. It selects a registry by repository, so
  // it can only ever be a source; gantry never connects to it, only to the
  // store one of its routes names.
  STORE_KIND_META = 4;
}

// How gantry fills a registry store as a copy destination.
enum StoreMode {
  STORE_MODE_UNSPECIFIED = 0;
  STORE_MODE_COPY = 1; // gantry pushes blobs (default).
  STORE_MODE_PROXY = 2; // reads through the destination so a pull-through cache self-fills.
}

// What operations the store supports. Registries get read/write; engines get
// pull plus the optional daemon capabilities discovered at dial time.
message StoreCapabilities {
  // Registry: gantry can pull blobs.
  bool read = 1;
  // Registry: gantry can push blobs.
  bool write = 2;
  // Engine: the daemon can be told to pull.
  bool pull = 3;
  // Engine: the daemon can verify signatures.
  bool verify = 4;
  // Engine: the daemon supports image GC.
  bool gc = 5;
  // Engine: inventory scans and untagged reaping.
  bool reconcile = 6;
}

// A registry or a daemon engine that images move between. Declared in
// gantry.yaml today; Add/Patch/Erase exist for the contract (and for seeding
// fakes in tests) even though the current server resolves stores from config.
message Store {
  // Unique name from configuration; the key clients address stores by.
  string name = 1 [(orm.field) = {key: true}];
  // Registry (oci), engine (docker/containerd), or a meta store that routes
  // between registries.
  StoreKind kind = 2 [(orm.field) = {immutable: true}];

  // Registry (oci) stores only: the registry host.
  string host = 3;
  // Registry (oci) stores only: how the registry is filled as a copy
  // destination.
  StoreMode mode = 4;

  // Engine (docker/containerd) stores only: the daemon endpoint.
  string address = 5;
  // containerd stores only: the containerd namespace.
  string namespace = 6;

  // Live status, derived per read: registries report ready from config,
  // engines are probed.
  bool ready = 7;
  // Engine readiness error, when not ready.
  string error = 8;
  // What operations the store supports.
  StoreCapabilities capabilities = 9;

  option (orm.message) = {
    rpc: {crud: true}
  };
}
