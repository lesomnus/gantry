edition = "2023";

package gantry;

import "gantry/store.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/gantry/pb";

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_DONE = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELED = 5;
}

enum VerifyMode {
  VERIFY_MODE_UNSPECIFIED = 0;
  VERIFY_MODE_OFF = 1;
  VERIFY_MODE_VERIFY_IF_PRESENT = 2;
  VERIFY_MODE_REQUIRE = 3;
}

enum TransferState {
  TRANSFER_STATE_UNSPECIFIED = 0;
  TRANSFER_STATE_PENDING = 1;
  TRANSFER_STATE_RUNNING = 2;
  TRANSFER_STATE_DONE = 3;
  TRANSFER_STATE_EXISTS = 4;
  TRANSFER_STATE_FAILED = 5;
}

enum LayerState {
  LAYER_STATE_UNSPECIFIED = 0;
  LAYER_STATE_PENDING = 1;
  LAYER_STATE_PULLING = 2;
  LAYER_STATE_DONE = 3;
  LAYER_STATE_EXISTS = 4;
  LAYER_STATE_FAILED = 5;
  // Moved by gantry into a registry, as opposed to fetched by a daemon.
  LAYER_STATE_COPIED = 6;
}

// Admission-time signature verification audit record; absent when
// verification is disabled.
message Verification {
  // Effective mode for the job's source store.
  VerifyMode mode = 1;
  // A signature was verified.
  bool verified = 2;
  // The digest the job was pinned to when verified.
  string digest = 3;
}

// Per-blob progress of a transfer step.
message Layer {
  // Blob digest.
  string digest = 1;
  // "os/arch" of the manifest this blob belongs to.
  string platform = 2;
  // Blob size in bytes, when known.
  int64 total = 3;
  // Bytes fetched so far.
  int64 done = 4;
  // Per-blob pull state.
  LayerState state = 5;
}

// One attempt at one step of a job: a registry copy, or an engine pull.
//
// A job's `transfers` are its attempts in execution order. Rows carrying the same
// `step` are ALTERNATIVES — the step needed any one of them to succeed, and a
// failed row followed by a done row of the same step is a source that could not
// serve the image followed by one that could. Rows carrying different `step`
// values are a SEQUENCE: separate hops, each of which had to happen. Reading the
// list without `step` cannot tell those apart.
message Transfer {
  // Target store name (or registry host).
  string store = 1;
  // Kind of the target store — which side ran this step.
  StoreKind kind = 2;
  // Source store name (or registry host).
  string source = 3;
  // The reference placed in the target.
  string ref = 4;
  // Manifest/index digest the step was anchored to, when known.
  string digest = 5;
  // Step state.
  TransferState state = 6;
  // Total bytes to move, when known.
  int64 bytes_total = 7;
  // Bytes moved so far.
  int64 bytes_done = 8;
  // Per-blob progress.
  repeated Layer layers = 9;
  // Failure text, on a failed step.
  string error = 10;
  // Which step of the job's plan this row belongs to. Rows sharing a step are
  // alternative sources for one hop; differing steps are consecutive hops. Values
  // are non-decreasing in list order but not necessarily 0..n-1: a step gantry
  // planned and then did not need leaves no row at all.
  uint32 step = 11;
}

// A move of one image from a source registry into a target store.
message Job {
  // Server-generated, e.g. "job_1f2e...".
  string id = 1 [(orm.field) = {
    key: true
    default: ""
  }];

  // Free-form key/value labels for organizing and selecting jobs. Purely
  // caller metadata — they do not change how the move runs, only how it is
  // found (List label matching). Fixed at submission and not changed through
  // the client surface (JobService.Patch is not a client operation); coalesced
  // callers still keep their own labels, since each holds a distinct job handle
  // server-side.
  map<string, string> labels = 7;
  
  // Image reference to move, e.g. "docker.io/library/redis:7".
  string ref = 8 [(orm.field) = {immutable: true}];
  // Source registry; defaults to the ref's registry. Unlike the REST API,
  // the gRPC surface addresses declared stores only — bare registry hosts
  // (allow_unknown_stores) are not expressible through a StoreRef.
  Store source = 9 [(orm.edge) = {
    nullable: true
    immutable: true
  }];
  // Target store: a registry (gantry copies) or an engine (daemon pulls).
  Store target = 10 [(orm.edge) = {immutable: true}];
  // Registry target: platforms to copy (empty = all). Engine
  // target: the single platform to pull (empty = daemon's).
  repeated string platforms = 11 [(orm.field) = {immutable: true}];
  // Engine target only: record the pulled image under these names
  // instead of the pull reference, so a cache-fed engine keeps the image
  // under its upstream name (e.g. "docker.io/library/redis:7"). Tag
  // references — or, for a digest-pinned job (a digest ref, or a verified
  // source), digest references carrying the pinned digest: those are
  // registered over the pulled content so the upstream digest name (e.g.
  // "cr.example.com/app@sha256:...") resolves locally without touching its
  // registry — unless the job falls back to that registry, which is the one
  // case the anchor comes from the origin (containerd image store only; a
  // classic docker graph-driver store rejects the job before pulling).
  // Non-empty replaces the pull-reference name entirely — include it in the
  // list to keep it.
  repeated string as = 12 [(orm.field) = {immutable: true}];

  google.protobuf.Timestamp date_ended = 13;
  google.protobuf.Timestamp date_started = 14;
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // Lifecycle state.
  JobState state = 16;
  // Failure text, on a failed job.
  string error = 17;
  // Admission verification record; absent when verification was off.
  Verification verification = 18;
  // The job's attempts, in execution order — grouped into hops by
  // Transfer.step. See Transfer.
  repeated Transfer transfers = 19;

  // Copy source referrer artifacts (signatures) along with the image.
  // Absent = server default (on when the job is verified).
  bool copy_referrers = 20 [
    features.field_presence = EXPLICIT,
    (orm.field) = {immutable: true}
  ];

  // Engine target only: when `source` cannot serve the image, pull it from the
  // registry named in `ref` (the origin) instead of failing — a cache is then
  // an optimization rather than a dependency. Whether the cache is empty
  // because its fill job failed, has not run yet, or is unreachable is one
  // indistinguishable fact from the pull's side, and none of them need fail the
  // job. The failed attempt stays on the record as a failed `transfers` entry
  // of a job that nevertheless completed. A digest-pinned job (a digest ref, or
  // a verified source) falls back to that same digest, so the origin cannot
  // serve different bytes; an unpinned job resolves its tag at the origin,
  // which is that tag's authority. Absent = server default
  // (worker.fallback_to_origin). Rejected for a registry target; a fallback that
  // cannot be expressed — an engine whose pull_host collapses both sources onto
  // one host, or an origin that resolves to no store — is an error only when the
  // request set this field explicitly, and otherwise just does not apply to that
  // job. On a job record this is the EFFECTIVE decision: false whenever the job
  // has no second source to reach, whatever the request said.
  bool fallback_to_origin = 21 [
    features.field_presence = EXPLICIT,
    (orm.field) = {immutable: true}
  ];

  option (orm.message) = {
    rpc: {crud: true}
  };
}
