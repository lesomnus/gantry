edition = "2023";
package gantry;

import "gantry/event.proto";
import "gantry/job.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lesomnus/gantry/pb";

service EventService {
  // Add creates a new Event
  rpc Add(EventAddRequest) returns (Event);
  // Get retrieves a Event
  rpc Get(EventGetRequest) returns (Event);
  // Patch updates an existing Event
  rpc Patch(EventPatchRequest) returns (Event);
  // Erase deletes a Event
  rpc Erase(EventRef) returns (google.protobuf.Empty);
  // List returns audit events newest-first.
  rpc List(EventListRequest) returns (EventListResponse);
}

message EventAddRequest {
  uint64 seq = 1;
  string store = 2 [features.field_presence = IMPLICIT];
  EventType type = 5 [features.field_presence = IMPLICIT];
  string ref = 8 [features.field_presence = IMPLICIT];
  string digest = 9 [features.field_presence = IMPLICIT];
  EventDetail detail = 10;
  JobState state = 16 [features.field_presence = IMPLICIT];
  string error = 17 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message EventGetRequest {
  EventRef ref = 1;
  EventSelect select = 2;
}

message EventRef {
  oneof key {
    uint64 seq = 1;
  }
}

message EventSelect {
  bool all = 1;
  bool store = 2;
  bool type = 5;
  bool ref = 8;
  bool digest = 9;
  bool detail = 10;
  bool state = 16;
  bool error = 17;
  bool date_created = 15;
}

message EventPatchRequest {
  EventRef ref = 1;
}

message EventListRequest {
  // Keep only events of this type.
  EventType type = 1;
  // Exact match on the store name.
  string store = 2;
  // Exact match on the recorded ref.
  string ref = 3;
  // Terminal job state, for job_done events.
  JobState state = 4;
  // Events recorded at or after this instant.
  google.protobuf.Timestamp since = 5;

  // Maximum items to return; 0 = no limit.
  int32 page_size = 10;
  // Continuation token from the previous response; empty starts from the
  // beginning.
  string page_token = 11;
}

message EventListResponse {
  // One page of results, newest-first.
  repeated Event items = 1;
  // Empty when there are no further results.
  string next_page_token = 2;
}
