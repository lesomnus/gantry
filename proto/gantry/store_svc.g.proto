edition = "2023";
package gantry;

import "gantry/gc.proto";
import "gantry/store.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lesomnus/gantry/pb";

service StoreService {
  // Add creates a new Store
  rpc Add(StoreAddRequest) returns (Store);
  // Get retrieves a Store
  rpc Get(StoreGetRequest) returns (Store);
  // Patch updates an existing Store
  rpc Patch(StorePatchRequest) returns (Store);
  // Erase deletes a Store
  rpc Erase(StoreRef) returns (google.protobuf.Empty);
  // List returns the declared stores, sorted by name.
  rpc List(StoreListRequest) returns (StoreListResponse);
  // Pull tells an engine store to pull an image, job-less and synchronous.
  rpc Pull(StorePullRequest) returns (StorePullResponse);
  // Remove deletes an image from an engine store and syncs the retention
  // index.
  rpc Remove(StoreRemoveRequest) returns (StoreRemoveResponse);
  // Health probes the store, served from a short-lived cache.
  rpc Health(StoreRef) returns (StoreHealthResponse);
  // GcStatus reports the store's GC scheduler, retention rules, and the
  // usage-watcher health.
  rpc GcStatus(StoreRef) returns (StoreGcStatusResponse);
  // GcPlan evaluates the store's retention policy without deleting
  // anything.
  rpc GcPlan(StoreGcRequest) returns (StoreGcPlanResponse);
  // GcApply evaluates and executes the deletions.
  rpc GcApply(StoreGcRequest) returns (StoreGcApplyResponse);
}

message StoreAddRequest {
  string name = 1 [features.field_presence = IMPLICIT];
  StoreKind kind = 2 [features.field_presence = IMPLICIT];
  string host = 3 [features.field_presence = IMPLICIT];
  StoreMode mode = 4 [features.field_presence = IMPLICIT];
  string address = 5 [features.field_presence = IMPLICIT];
  string namespace = 6 [features.field_presence = IMPLICIT];
  bool ready = 7 [features.field_presence = IMPLICIT];
  string error = 8 [features.field_presence = IMPLICIT];
  StoreCapabilities capabilities = 9;
}

message StoreGetRequest {
  StoreRef ref = 1;
  StoreSelect select = 2;
}

message StoreRef {
  oneof key {
    string name = 1;
  }
}

message StoreSelect {
  bool all = 1;
  bool kind = 2;
  bool host = 3;
  bool mode = 4;
  bool address = 5;
  bool namespace = 6;
  bool ready = 7;
  bool error = 8;
  bool capabilities = 9;
}

message StorePatchRequest {
  StoreRef ref = 1;
  string host = 5;
  StoreMode mode = 7;
  string address = 9;
  string namespace = 11;
  bool ready = 13;
  string error = 15;
  StoreCapabilities capabilities = 17;
  bool capabilities_null = 18;
}

message StoreListRequest {
  // Keep only stores of this kind.
  StoreKind kind = 1;

  // Maximum items to return; 0 = no limit.
  int32 page_size = 10;
  // Continuation token from the previous response; empty starts from the
  // beginning.
  string page_token = 11;
}

message StoreListResponse {
  // One page of results, sorted by name.
  repeated Store items = 1;
  // Empty when there are no further results.
  string next_page_token = 2;
}

message StorePullRequest {
  // Engine store that pulls.
  StoreRef store = 1;
  // Image reference to pull.
  string ref = 2;
  // Platform to pull ("os/arch"); empty uses the daemon's default.
  string platform = 3;
}

message StorePullResponse {
  // The reference the engine pulled.
  string ref = 1;
}

message StoreRemoveRequest {
  // Engine store to remove from.
  StoreRef store = 1;
  // Image reference to remove.
  string ref = 2;
}

message StoreRemoveResponse {
  // Tag refs removed; disk is freed only when the last tag and its content
  // are gone.
  repeated string untagged = 1;
  // Content IDs whose bytes were actually deleted.
  repeated string deleted = 2;
}

message StoreHealthResponse {
  // The probe succeeded.
  bool healthy = 1;
  // Kind of the probed store.
  StoreKind kind = 2;
  // Probe round-trip in milliseconds.
  int64 latency_ms = 3;
  // Probe failure text.
  string error = 4;
  google.protobuf.Timestamp date_checked = 5;
  // True when served from the TTL cache rather than probed for this call.
  bool cached = 6;
}

message StoreGcStatusResponse {
  // Scheduling is on for this store.
  bool enabled = 1;
  // A GC run is in flight right now.
  bool running = 2;
  google.protobuf.Timestamp started = 3;
  google.protobuf.Timestamp last_run = 4;
  google.protobuf.Timestamp next_wake = 5;
  google.protobuf.Timestamp grace_until = 6;
  // Effective scheduler settings.
  GcSchedule schedule = 7;
  // Configured retention rules.
  repeated GcRule rules = 8;
  // Tracked image records.
  int32 records = 9;
  // Live pins.
  int32 pins = 10;
  // Tracked untagged images (reap clocks running).
  int32 untagged = 11;
  // Reap delay; absent when the reaper is off.
  google.protobuf.Duration untagged_after = 12;
  // Usage-event stream health.
  GcWatcherStatus watcher = 13;
}

message StoreGcRequest {
  // Store to run GC against.
  StoreRef store = 1;
  // Optional one-shot policy override.
  GcOverride override = 2;
}

message StoreGcPlanResponse {
  // Images that would be deleted.
  repeated GcCandidate delete = 1;
  // Records kept, and why.
  repeated GcKept keep = 2;
  // The soonest a currently-kept record could become age-deletable; absent
  // when nothing is on an age path.
  google.protobuf.Timestamp next_age_out = 3;
}

message StoreGcApplyResponse {
  // Number of records considered (delete + keep).
  int32 evaluated = 1;
  // Tag refs removed.
  repeated string untagged = 2;
  // Content-hash IDs whose bytes were freed.
  repeated string deleted = 3;
  // Untagged image IDs whose content was reaped.
  repeated string reaped = 4;
  // Untagged image IDs not reapable right now (re-tagged, container ref,
  // in-flight pull).
  repeated string skipped = 5;
  // Per-ref removal failures, "<ref>: <err>".
  repeated string errors = 6;
}
