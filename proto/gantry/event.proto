edition = "2023";

package gantry;

import "gantry/job.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/gantry/pb";

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_JOB_ADMITTED = 1;
  EVENT_TYPE_JOB_DONE = 2;
  EVENT_TYPE_GC_APPLIED = 3;
  EVENT_TYPE_IMAGE_PULLED = 4;
  EVENT_TYPE_IMAGE_REMOVED = 5;
  EVENT_TYPE_PINNED = 6;
  EVENT_TYPE_UNPINNED = 7;
  EVENT_TYPE_JOB_FALLBACK = 8;
}

// Type-specific payload; which fields are set depends on the event type.
message EventDetail {
  // job_admitted, job_fallback: the source store — the one the job was admitted
  // with for job_admitted, the one that could not serve it for job_fallback.
  string source = 1;
  // job_done: the job id.
  string job = 2;
  // job_done: total bytes moved.
  int64 bytes = 3;
  // gc_applied: content IDs whose bytes were freed.
  int32 deleted = 4;
  // gc_applied: tag refs removed.
  int32 untagged = 5;
  // gc_applied: untagged images whose content was reaped.
  int32 reaped = 6;
  // gc_applied: per-ref removal failures.
  int32 errors = 7;
}

// One entry of the append-only audit log. Written internally by gantry;
// Add/Patch/Erase exist for the contract and for seeding fakes in tests.
// The store is recorded by name (not an edge) so audit entries outlive
// store re-configuration.
message Event {
  // Assigned from the log's monotonic sequence.
  uint64 seq = 1 [(orm.field) = {
    key: true
    default: ""
  }];

  // Name of the store the event concerns.
  string store = 2 [(orm.field) = {immutable: true}];
  // What happened; selects which of the fields below are set.
  EventType type = 5 [(orm.field) = {immutable: true}];
  
  // Image reference; a pin value for pinned/unpinned, an image ID for
  // untagged reaps.
  string ref = 8 [(orm.field) = {immutable: true}];
  // Verified source digest, on job_admitted.
  string digest = 9 [(orm.field) = {immutable: true}];
  // Type-specific payload.
  EventDetail detail = 10 [(orm.field) = {immutable: true}];

  // Terminal job state, on job_done.
  JobState state = 16 [(orm.field) = {immutable: true}];
  // Failure text, on job_done of a failed job.
  string error = 17 [(orm.field) = {immutable: true}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true}];

  option (orm.message) = {
    rpc: {crud: true}
  };
}
