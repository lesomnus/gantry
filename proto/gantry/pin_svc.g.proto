edition = "2023";
package gantry;

import "gantry/pin.proto";
import "gantry/store_svc.g.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lesomnus/gantry/pb";

service PinService {
  // Add creates a new Pin
  rpc Add(PinAddRequest) returns (Pin);
  // Get retrieves a Pin
  rpc Get(PinGetRequest) returns (Pin);
  // Patch updates an existing Pin
  rpc Patch(PinPatchRequest) returns (Pin);
  // Erase deletes a Pin
  rpc Erase(PinRef) returns (google.protobuf.Empty);
  // List returns the pins of a store.
  rpc List(PinListRequest) returns (PinListResponse);
}

message PinAddRequest {
  bytes id = 1;
  StoreRef store = 2;
  string value = 8 [features.field_presence = IMPLICIT];
  bool pattern = 9 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_pinned = 15;
}

message PinGetRequest {
  PinRef ref = 1;
  PinSelect select = 2;
}

message PinRef {
  oneof key {
    bytes id = 1;
    PinRefByValue value = 2;
  }
}

message PinRefByValue {
  StoreRef store = 2;
  string value = 8;
}

message PinSelect {
  bool all = 1;
  StoreSelect store = 2;
  bool value = 8;
  bool pattern = 9;
  bool date_pinned = 15;
}

message PinPatchRequest {
  PinRef ref = 1;
  bool pattern = 17;
  google.protobuf.Timestamp date_pinned = 29;
}

message PinListRequest {
  // Store whose pins to list.
  StoreRef store = 1;

  // Maximum items to return; 0 = no limit.
  int32 page_size = 10;
  // Continuation token from the previous response; empty starts from the
  // beginning.
  string page_token = 11;
}

message PinListResponse {
  // One page of results.
  repeated Pin items = 1;
  // Empty when there are no further results.
  string next_page_token = 2;
}
