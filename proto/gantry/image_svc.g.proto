edition = "2023";
package gantry;

import "gantry/image.proto";
import "gantry/store_svc.g.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lesomnus/gantry/pb";

service ImageService {
  // Add creates a new Image
  rpc Add(ImageAddRequest) returns (Image);
  // Get retrieves a Image
  rpc Get(ImageGetRequest) returns (Image);
  // Patch updates an existing Image
  rpc Patch(ImagePatchRequest) returns (Image);
  // Erase deletes a Image
  rpc Erase(ImageRef) returns (google.protobuf.Empty);
  // List returns the image inventory of a store.
  rpc List(ImageListRequest) returns (ImageListResponse);
}

message ImageAddRequest {
  bytes id = 1;
  StoreRef store = 2;
  string ref = 8 [features.field_presence = IMPLICIT];
  string digest = 9 [features.field_presence = IMPLICIT];
  string repo = 10 [features.field_presence = IMPLICIT];
  string tag = 11 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_last_distributed = 13;
  google.protobuf.Timestamp date_last_used = 14;
  google.protobuf.Timestamp date_first_seen = 15;
  bool pinned = 16 [features.field_presence = IMPLICIT];
  bool in_use = 17 [features.field_presence = IMPLICIT];
}

message ImageGetRequest {
  ImageRef ref = 1;
  ImageSelect select = 2;
}

message ImageRef {
  oneof key {
    bytes id = 1;
    ImageRefByLocator locator = 2;
  }
}

message ImageRefByLocator {
  StoreRef store = 2;
  string ref = 8;
}

message ImageSelect {
  bool all = 1;
  StoreSelect store = 2;
  bool ref = 8;
  bool digest = 9;
  bool repo = 10;
  bool tag = 11;
  bool date_last_distributed = 13;
  bool date_last_used = 14;
  bool date_first_seen = 15;
  bool pinned = 16;
  bool in_use = 17;
}

message ImagePatchRequest {
  ImageRef ref = 1;
  string digest = 17;
  google.protobuf.Timestamp date_last_distributed = 25;
  google.protobuf.Timestamp date_last_used = 27;
  bool pinned = 31;
  bool in_use = 33;
}

message ImageListRequest {
  // Store whose inventory to list.
  StoreRef store = 1;
  // Exact match on the host-qualified repository.
  string repo = 2;
  // Exact match on the full reference.
  string ref = 3;
  // Keep only pinned (true) or unpinned (false) images.
  bool pinned = 4;
  // Filter on live container usage; replaces the REST /inuse endpoint.
  bool in_use = 5;

  // Maximum items to return; 0 = no limit.
  int32 page_size = 10;
  // Continuation token from the previous response; empty starts from the
  // beginning.
  string page_token = 11;
}

message ImageListResponse {
  // One page of results.
  repeated Image items = 1;
  // Empty when there are no further results.
  string next_page_token = 2;
  // Present only on unfiltered lists, mirroring the REST endpoint.
  repeated UntaggedImage untagged = 3;
}

// Reap clock of an image observed with no tags (docker engines only).
message UntaggedImage {
  // Engine image ID.
  string id = 1;
  google.protobuf.Timestamp date_first_seen = 15;
}
