# gantry store configuration
#
#   remote (cr.hday.io) ──copy──▶ local (192.168.10.33:5000) ──pull──▶ docker daemons
#
# Run with: gantry serve --config gantry.hday.yaml
#
# `stores` is a top-level section (not nested under `serve`).
stores:
  # Source registry (remote). Jobs name this as `from`.
  remote:
    kind: oci
    host: cr.hday.io

  # Local cache registry gantry fills and the daemons pull from.
  # Jobs name this as `to`.
  local:
    kind: oci
    host: "192.168.10.33:5000"
    insecure: true          # plain-HTTP registry on :5000
    mode: copy              # push blobs into the cache
    # source ref -> ref in this registry (first match wins).
    rewrite:
      - { "**": "{{.CacheHost}}/{{.Repo}}" }

  # Docker daemons gantry triggers to pull the cached image.
  # Load a cached image onto one of these with POST /v1/store/{name}/pull.
  dockerd-10-2:
    kind: docker
    address: "tcp://192.168.10.2:2376"    # daemon TLS port
    # Connect over mTLS with the TPM device key (fdy). The private key stays in
    # the TPM; device.crt is presented as the client certificate and ca.crt
    # verifies the daemon's server certificate.
    tpm_handle: "0x81666479"              # fdy (device AK persistent handle)
    tpm_cert: "device.crt"                # client cert (leaf + chain), PEM
    ca_cert: "ca.crt"                     # CA that signed the daemon's server cert
  dockerd-10-33:
    kind: docker
    address: "unix:///var/run/docker.sock"   # host docker socket
  dockerd-10-34:
    kind: docker
    address: "tcp://192.168.10.34:2375"
